<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puff健身 - 训练中</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #333;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 隐藏滚动条但保留滚动功能 */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* 确保内容区域可以滚动 */
        .scrollable {
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
            flex: 1;
            padding: 0 1rem;
            padding-bottom: 1rem;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .timer-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .timer-circle::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: conic-gradient(#5046e4 0%, #5046e4 var(--progress, 75%), #e6e6e6 var(--progress, 75%), #e6e6e6 100%);
        }
        
        .timer-circle::after {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: white;
        }
        
        .timer-text {
            position: relative;
            z-index: 10;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .exercise-progress {
            height: 4px;
            background-color: #e6e6e6;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .exercise-progress-bar {
            height: 100%;
            background-color: #5046e4;
            border-radius: 2px;
            width: var(--progress, 60%);
        }
    </style>
</head>
<body class="flex flex-col h-full">
    <!-- 顶部导航栏 -->
    <header class="p-4 flex justify-between items-center">
        <button class="p-2 rounded-full bg-gray-100">
            <i class="fas fa-arrow-left text-gray-600"></i>
        </button>
        <h1 class="text-xl font-bold">上肢力量训练</h1>
        <button class="p-2 rounded-full bg-gray-100">
            <i class="fas fa-ellipsis-h text-gray-600"></i>
        </button>
    </header>

    <!-- 主要内容区 -->
    <main class="flex-1 scrollable p-4 pb-20 flex flex-col items-center">
        <!-- 当前动作信息 -->
        <section class="w-full mb-6 text-center">
            <h2 class="text-2xl font-bold mb-1">哑铃卧推</h2>
            <p class="text-gray-600">第2组，共4组 · 12次/组</p>
        </section>
        
        <!-- 计时器 -->
        <section class="mb-8">
            <div class="timer-circle">
                <div class="timer-text text-center">
                    <span class="text-4xl font-bold block">00:45</span>
                    <span class="text-gray-500">剩余时间</span>
                </div>
            </div>
        </section>
        
        <!-- 控制按钮 -->
        <section class="flex justify-center space-x-6 mb-8">
            <button class="control-btn bg-gray-200 text-gray-600">
                <i class="fas fa-redo-alt"></i>
            </button>
            <button class="control-btn bg-indigo-600 text-white">
                <i class="fas fa-pause"></i>
            </button>
            <button class="control-btn bg-gray-200 text-gray-600">
                <i class="fas fa-forward"></i>
            </button>
        </section>
        
        <!-- 动作指导 -->
        <section class="glass-card w-full p-4 mb-6">
            <h3 class="font-bold mb-2">动作指导</h3>
            <p class="text-gray-600 text-sm mb-3">1. 平躺在卧推凳上，双脚平放在地面</p>
            <p class="text-gray-600 text-sm mb-3">2. 双手握住哑铃，与肩同宽</p>
            <p class="text-gray-600 text-sm mb-3">3. 吸气，慢慢将哑铃降至胸部</p>
            <p class="text-gray-600 text-sm">4. 呼气，将哑铃推回起始位置</p>
        </section>
        
        <!-- 训练进度 -->
        <section class="w-full">
            <div class="flex justify-between mb-2">
                <span class="text-sm font-medium">训练进度</span>
                <span class="text-sm text-gray-600">2/6 动作</span>
            </div>
            <div class="exercise-progress mb-4">
                <div class="exercise-progress-bar" style="--progress: 33%"></div>
            </div>
            <div class="flex justify-between">
                <div class="glass-card p-3 flex items-center space-x-3 opacity-50">
                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center">
                        <i class="fas fa-check text-gray-400"></i>
                    </div>
                    <div>
                        <p class="font-medium">引体向上</p>
                        <p class="text-xs text-gray-500">4组 x 8次</p>
                    </div>
                </div>
                <div class="glass-card p-3 flex items-center space-x-3">
                    <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center">
                        <i class="fas fa-dumbbell text-indigo-600"></i>
                    </div>
                    <div>
                        <p class="font-medium">哑铃卧推</p>
                        <p class="text-xs text-gray-500">4组 x 12次</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部操作栏 -->
    <footer class="p-4 fixed bottom-0 left-0 right-0 bg-white">
        <button class="w-full py-3 bg-indigo-600 text-white font-medium rounded-xl">
            完成当前组
        </button>
    </footer>

    <script>
        // 计时器功能
        let timerInterval;
        let seconds = 45;
        let isRunning = true;
        
        function updateTimer() {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            const displayTime = `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
            document.querySelector('.timer-text span:first-child').textContent = displayTime;
            
            // 更新进度环
            const progress = (seconds / 45) * 100;
            document.querySelector('.timer-circle').style.setProperty('--progress', `${progress}%`);
            
            if (seconds <= 0) {
                clearInterval(timerInterval);
                document.querySelector('.timer-text span:first-child').textContent = "00:00";
                alert("时间到！");
            }
        }
        
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                document.querySelector('.control-btn.bg-indigo-600 i').className = 'fas fa-pause';
                timerInterval = setInterval(() => {
                    if (seconds > 0) {
                        seconds--;
                        updateTimer();
                    } else {
                        clearInterval(timerInterval);
                    }
                }, 1000);
            }
        }
        
        function pauseTimer() {
            if (isRunning) {
                isRunning = false;
                document.querySelector('.control-btn.bg-indigo-600 i').className = 'fas fa-play';
                clearInterval(timerInterval);
            } else {
                startTimer();
            }
        }
        
        function resetTimer() {
            clearInterval(timerInterval);
            seconds = 45;
            isRunning = false;
            document.querySelector('.control-btn.bg-indigo-600 i').className = 'fas fa-play';
            updateTimer();
        }
        
        // 初始化计时器
        updateTimer();
        timerInterval = setInterval(() => {
            if (seconds > 0) {
                seconds--;
                updateTimer();
            } else {
                clearInterval(timerInterval);
            }
        }, 1000);
        
        // 绑定按钮事件
        document.querySelectorAll('.control-btn')[0].addEventListener('click', resetTimer);
        document.querySelectorAll('.control-btn')[1].addEventListener('click', pauseTimer);
        document.querySelectorAll('.control-btn')[2].addEventListener('click', () => {
            seconds = Math.max(0, seconds - 10);
            updateTimer();
        });
        
        // 完成当前组按钮
        document.querySelector('footer button').addEventListener('click', () => {
            resetTimer();
            alert("已完成当前组！");
        });
    </script>
</body>
</html>
