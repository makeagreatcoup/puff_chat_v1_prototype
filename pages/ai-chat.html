<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puff健身 - AI助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: white;
            color: #333;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
        }
        
        /* 隐藏滚动条但保留滚动功能 */
        ::-webkit-scrollbar {
            width: 0;
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: transparent;
        }
        
        /* 确保内容区域可以滚动 */
        .scrollable {
            overflow-y: auto;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
            height: 100%;
            max-height: 100%;
            scroll-behavior: smooth;
            padding-bottom: 80px; /* 为固定的输入框留出空间 */
        }
        
        .scrollable::-webkit-scrollbar {
            display: none;  /* Chrome, Safari, Opera */
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .chat-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.3s ease forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user-bubble {
            background-color: #5046e4;
            color: white;
            border-bottom-right-radius: 4px;
            align-self: flex-end;
        }
        
        .ai-bubble {
            background-color: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }
        
        .suggestion-chip {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s ease;
        }
        
        .suggestion-chip:hover {
            background-color: #5046e4;
            color: white;
        }

        /* 关闭按钮动画 */
        .close-btn {
            transition: transform 0.2s ease;
        }

        .close-btn:hover {
            transform: rotate(90deg);
        }

        /* 输入框焦点效果 */
        .chat-input:focus {
            box-shadow: 0 0 0 2px rgba(80, 70, 228, 0.1);
        }

        /* 固定输入框区域 */
        .input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 16px;
            border-top: 1px solid rgba(229, 231, 235, 0.5);
            z-index: 10;
        }
    </style>
</head>
<body class="flex flex-col h-full">
    <!-- 顶部导航栏 -->
    <header class="p-4 flex justify-between items-center border-b border-gray-100">
        <h1 class="text-xl font-bold text-gray-800">AI健身助手</h1>
        <button class="close-btn p-2 rounded-full hover:bg-gray-100 transition-colors" onclick="window.parent.closeAIChat({target: window.parent.document.getElementById('aiChatModal')})">
            <i class="fas fa-times text-gray-600"></i>
        </button>
    </header>

    <!-- 主要内容区 -->
    <main class="flex-1 p-4 flex flex-col scrollable" id="chatContainer">
        <!-- AI消息 -->
        <div class="chat-bubble ai-bubble flex items-start">
            <div class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-500 to-indigo-600 flex items-center justify-center mr-2 flex-shrink-0">
                <i class="fas fa-robot text-white text-xs"></i>
            </div>
            <div>
                <p class="mb-1">你好！我是你的AI健身助手。我可以帮你制定个性化的健身计划，回答健身相关问题，或者给你一些健身建议。你想要什么样的帮助呢？</p>
                <span class="text-xs text-gray-500">10:30</span>
            </div>
        </div>
    </main>

    <!-- 固定在底部的输入框 -->
    <div class="input-container">
        <div class="flex space-x-2">
            <input type="text" class="chat-input flex-1 px-4 py-2 rounded-full border border-gray-200 focus:outline-none focus:border-indigo-600" placeholder="输入你的问题...">
            <button class="p-2 rounded-full bg-indigo-600 text-white hover:bg-indigo-700 transition-colors">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</body>
</html>
